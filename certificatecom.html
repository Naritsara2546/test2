<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certificate Generator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/0.4.1/html2canvas.min.js"></script>
    <style>
        /* สไตล์เหมือนเดิม */
    </style>
</head>
<body>

    <form id="certificateForm">
        <label for="name">ชื่อผู้รับเกียรติบัตร:</label>
        <input type="text" id="name" name="name" placeholder="กรอกชื่อ" required>
        <button type="submit">สร้างเกียรติบัตร</button>
    </form>

    <div id="certificate" class="certificate-container" style="display: none;">
        <img src="https://upload.wikimedia.org/wikipedia/th/thumb/d/d9/Mahasarakham_Business_School_Logo.svg/1200px-Mahasarakham_Business_School_Logo.svg.png" alt="Logo" class="logo">
        <div class="certificate-title">สาขาคอมพิวเตอร์ธุรกิจ</div>
        <div class="certificate-subtitle">คณะการบัญชีและการจัดการ มหาวิทยาลัยมหาสารคาม</div>
        <div class="certificate-body">
            ขอมอบเกียรติบัตรฉบับนี้เพื่อแสดงว่า<br>
            <span class="name" id="certificateName"></span><br>
            ได้ผ่านการทดสอบความรู้ด้านวิชาคอมพิวเตอร์ ร้อยละ 80%<br>
            คณะการบัญชีและการจัดการ มหาวิทยาลัยมหาสารคาม
        </div>
        <div class="date" id="currentDate"></div>
        <div class="signature">
            <p>นริศรา</p>
            <p>คณบดี คณะการบัญชีและการจัดการ</p>
        </div>
    </div>

    <button id="downloadButton" style="display: none;">ดาวน์โหลดเกียรติบัตร</button>

    <script>
        const form = document.getElementById("certificateForm");
        const certificate = document.getElementById("certificate");
        const certificateName = document.getElementById("certificateName");
        const currentDate = document.getElementById("currentDate");
        const downloadButton = document.getElementById("downloadButton");

        function getCurrentDate() {
            const today = new Date();
            const options = { year: 'numeric', month: 'long', day: 'numeric' };
            return today.toLocaleDateString('th-TH', options);
        }

        form.addEventListener("submit", function (e) {
            e.preventDefault();
            const name = document.getElementById("name").value;
            certificateName.textContent = name;
            currentDate.textContent = "วันที่ " + getCurrentDate();
            certificate.style.display = "block";
            downloadButton.style.display = "inline-block";
        });

        downloadButton.addEventListener("click", function () {
    // รอให้โลโก้และเนื้อหาของเกียรติบัตรโหลดก่อน
    const logo = document.querySelector('.logo');
    if (logo.complete) {
        downloadCertificate();
    } else {
        logo.onload = function() {
            downloadCertificate();
        };
    }
});

function downloadCertificate() {
    // ใช้ html2canvas เพื่อแปลงเนื้อหาของเกียรติบัตร (ไม่ใช่แค่โลโก้)
    html2canvas(certificate).then(canvas => {
        const link = document.createElement("a");
        link.download = "certificate.png"; // กำหนดชื่อไฟล์ที่ดาวน์โหลด
        link.href = canvas.toDataURL("image/png"); // สร้างลิงก์ที่อ้างอิงไปยังภาพที่แปลง
        link.click(); // คลิกเพื่อลงมือดาวน์โหลด
    }).catch(function(error) {
        console.error("เกิดข้อผิดพลาดในการสร้างภาพ:", error);
        alert("เกิดข้อผิดพลาดในการสร้างเกียรติบัตร");
    });
}

    </script>

</body>
</html>
